name: CI

# The release workflow gates every step it has behind release_created, so nothing there
# runs on a pull request. Without this, a dependency bump could be merged on a green
# check having never once built the theme.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The fixture deck exercises every layout and component, so building it is what
      # says the theme still loads.
      - run: pnpm build
      # Slower than the rest put together: it boots Slidev and a browser to ask what the
      # deck turned out to be. The browser is already here, since playwright-chromium
      # fetches it on install.
      - run: pnpm test:deck
